version: 1
backend:
  phases:
    build:
      commands:
        # Vite 8 necesita Node 22
        - nvm install 22 && nvm use 22
        # npm install y no npm ci: @aws-amplify/data-construct 1.17.8 trae dentro una copia de
        # plugin-types que pide @aws-cdk/toolkit-lib@1.19.0 sin incluirlo, y npm ci lo rechaza.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use 22
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
